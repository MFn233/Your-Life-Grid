<!DOCTYPE html>
<html lang="zh-hans">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Life Grid</title>
    <style>
        .title-section {
            width: 100%;
            text-align: center;
        }

        span.title {
            display: block;
            font-size: 50px;
        }
        
        .input-section {
            width: 100%;
            text-align: center;
        }
        
    </style>
</head>

<body>
    <div class="container">
        <div class="title-section">
            <span class="title">Could you please tell me your birthday?</span>
        </div>
        <div class="input-section">
            <input class="date" id="date" type="date" />
            <input class="button" id="dateSubmit" type="button" value="Submit" />
            <input class="button" id="redirect" type="button" value="No, thanks." />
        </div>

    </div>

</body>

</html>
