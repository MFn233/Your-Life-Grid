<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Life Grid · Start</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background 0.3s;
        }

        /* 入场动画 */
        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0px) scale(1);
            }
        }

        /* 离场动画 */
        @keyframes fadeSlideDown {
            0% {
                opacity: 1;
                transform: translateY(0px) scale(1);
                pointer-events: none;
            }
            100% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
                pointer-events: none;
            }
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.03), 0 0 0 1px rgba(0, 0, 0, 0.01);
            padding: 2.5rem 2rem 2.8rem;
            transition: all 0.2s ease;
            text-align: center;
            animation: fadeSlideUp 0.48s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            position: relative;
        }

        .container.exit-animation {
            animation: fadeSlideDown 0.35s ease-in forwards;
        }

        /* 语言切换按钮 */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 24px;
            background: #eef2f5;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #2c5f6e;
            font-weight: 500;
            transition: 0.2s;
            z-index: 10;
        }
        .lang-switch:hover {
            background: #e2e8ed;
            transform: translateY(-1px);
        }

        .title-section {
            width: 100%;
            text-align: center;
            margin-bottom: 2.2rem;
            margin-top: 0.5rem;
        }

        .title {
            display: block;
            font-size: 1.9rem;
            font-weight: 470;
            letter-spacing: -0.3px;
            color: #1a2c3e;
            line-height: 1.3;
        }

        .sub-note {
            font-size: 0.9rem;
            color: #8b9aab;
            margin-top: 0.7rem;
            font-weight: 400;
        }

        .input-section {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
            margin-top: 0.5rem;
        }

        .date-input {
            width: 100%;
            max-width: 260px;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid #dce3e9;
            border-radius: 48px;
            background-color: #ffffff;
            transition: 0.2s;
            text-align: center;
            color: #1e2f3d;
            outline: none;
        }

        .date-input:focus {
            border-color: #9aaebf;
            box-shadow: 0 0 0 2px rgba(90, 120, 140, 0.1);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            margin-top: 0.2rem;
        }

        .btn {
            border: none;
            background: #f0f2f5;
            padding: 0.7rem 1.8rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            color: #1f3a4b;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background-color: #2c5f6e;
            color: white;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .btn-primary:hover {
            background-color: #1e4652;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #eef2f5;
            color: #4b6a7c;
            border: 1px solid #e2e8ed;
        }

        .btn-secondary:hover {
            background-color: #e4e9ef;
        }

        .divider-light {
            width: 48px;
            height: 2px;
            background: #e2e8f0;
            margin: 1rem auto 0.2rem;
            border-radius: 2px;
        }

        /* 打印时隐藏语言切换按钮 */
        @media print {
            .lang-switch {
                display: none;
            }
        }
    </style>
</head>

<body>
<div class="container" id="appContainer">
    <button class="lang-switch" id="langSwitchBtn">中文</button>

    <div class="title-section">
        <span class="title" id="titleText">Could you please tell me your birthday?</span>
        <div class="sub-note" id="subNoteText">· One sheet of paper, 900 squares ·</div>
    </div>

    <div class="input-section">
        <input class="date-input" id="birthDate" type="date" value="1995-06-13" />
        <div class="button-group">
            <input class="btn btn-primary" id="submitBtn" type="button" value="See my grid →" />
            <input class="btn btn-secondary" id="skipBtn" type="button" value="No, thanks." />
        </div>
    </div>
    <div class="divider-light"></div>
</div>

<script>
    (function() {
        // ---------- 多语言文本库（可扩展） ----------
        const locales = {
            en: {
                title: "Could you please tell me your birthday?",
                subNote: "· One sheet of paper, 900 squares ·",
                submitBtn: "See my grid →",
                skipBtn: "No, thanks.",
                emptyBirthdayAlert: "🌸 Please enter your birthday to create your life grid.",
                invalidDateAlert: "📅 Invalid date. Please select a valid year/month/day."
            },
            zh: {
                title: "能告诉我你的生日吗？",
                subNote: "· 一张纸，九百格 ·",
                submitBtn: "查看我的人生格 →",
                skipBtn: "不了，谢谢",
                emptyBirthdayAlert: "🌸 请输入你的生日来创建你的人生格。",
                invalidDateAlert: "📅 日期无效，请选择有效的年月日。"
            }
        };

        let currentLang = 'en';
        const langSwitchBtn = document.getElementById('langSwitchBtn');

        // 获取需要动态更新的元素
        const titleEl = document.getElementById('titleText');
        const subNoteEl = document.getElementById('subNoteText');
        const submitBtn = document.getElementById('submitBtn');
        const skipBtn = document.getElementById('skipBtn');

        // 更新所有界面文本
        function updateUILanguage() {
            const t = locales[currentLang];
            titleEl.textContent = t.title;
            subNoteEl.textContent = t.subNote;
            submitBtn.value = t.submitBtn;
            skipBtn.value = t.skipBtn;
            langSwitchBtn.textContent = currentLang === 'en' ? '中文' : 'English';
        }

        function setLanguage(lang) {
            if (!locales[lang]) return;
            currentLang = lang;
            updateUILanguage();
            localStorage.setItem('lifeGridStartLang', lang);
        }

        function toggleLanguage() {
            const newLang = currentLang === 'en' ? 'zh' : 'en';
            setLanguage(newLang);
        }

        // ---------- 原有功能（保持不变，仅 alert 改用当前语言） ----------
        const dateInput = document.getElementById('birthDate');
        const container = document.getElementById('appContainer');
        let isTransitioning = false;

        function calculateMonthsLived(birthDateObj, today = new Date()) {
            if (!(birthDateObj instanceof Date) || isNaN(birthDateObj.getTime())) {
                return 0;
            }
            const birth = new Date(birthDateObj.getFullYear(), birthDateObj.getMonth(), birthDateObj.getDate());
            const now = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            if (now < birth) return 0;
            let yearDiff = now.getFullYear() - birth.getFullYear();
            let monthDiff = now.getMonth() - birth.getMonth();
            let totalMonths = yearDiff * 12 + monthDiff;
            if (now.getDate() < birth.getDate()) totalMonths -= 1;
            if (totalMonths < 0) totalMonths = 0;
            const MAX_MONTHS = 900;
            if (totalMonths > MAX_MONTHS) totalMonths = MAX_MONTHS;
            return totalMonths;
        }

        function parseDateFromInput(dateString) {
            if (!dateString) return null;
            const parts = dateString.split('-');
            if (parts.length !== 3) return null;
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            if (isNaN(year) || isNaN(month) || isNaN(day)) return null;
            return new Date(year, month, day);
        }

        function redirectWithExit(targetUrl) {
            if (isTransitioning) return;
            isTransitioning = true;
            container.classList.add('exit-animation');
            document.body.style.transition = 'background 0.2s';
            document.body.style.backgroundColor = '#f0f3f8';
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 350);
        }

        function onSubmit() {
            if (isTransitioning) return;
            let rawDate = dateInput.value;
            if (!rawDate) {
                alert(locales[currentLang].emptyBirthdayAlert);
                return;
            }
            const birthDateObj = parseDateFromInput(rawDate);
            if (!birthDateObj) {
                alert(locales[currentLang].invalidDateAlert);
                return;
            }
            const today = new Date();
            const monthsLived = calculateMonthsLived(birthDateObj, today);
            const targetUrl = `./grid.html?monthsLived=${monthsLived}`;
            redirectWithExit(targetUrl);
        }

        function onSkip() {
            if (isTransitioning) return;
            const targetUrl = `./grid.html?monthsLived=-1`;
            redirectWithExit(targetUrl);
        }

        // 绑定事件
        const submitBtnEl = document.getElementById('submitBtn');
        const skipBtnEl = document.getElementById('skipBtn');
        if (submitBtnEl) submitBtnEl.addEventListener('click', onSubmit);
        if (skipBtnEl) skipBtnEl.addEventListener('click', onSkip);

        dateInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                onSubmit();
            }
        });

        window.addEventListener('pageshow', function() {
            isTransitioning = false;
            container.classList.remove('exit-animation');
            document.body.style.backgroundColor = '';
        });

        // 初始化语言
        const savedLang = localStorage.getItem('lifeGridStartLang');
        if (savedLang === 'zh') setLanguage('zh');
        else if (savedLang === 'en') setLanguage('en');
        else {
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang.toLowerCase().startsWith('zh')) setLanguage('zh');
            else setLanguage('en');
        }

        // 语言切换按钮事件
        langSwitchBtn.addEventListener('click', toggleLanguage);
    })();
</script>
</body>

</html>
